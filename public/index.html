 p.innerHTML=`<h1>Log</h1><p style="margin-bottom:12px">Ghi lại đăng nhập, thay đổi trong admin, lời chúc gửi / bị chặn. Giữ 500 dòng mới nhất, không lưu IP.</p><div class=tabs>${LF.map(([k,l])=>`<a data-lf=${k} class="${k==LGF?'on':''}">${l}</a>`).join('')}</div><p style="margin-bottom:12px"><button id=lx>Tải log (JSON)</button> <button id=lc class=dg>Xóa log</button> <small>${G.length} dòng</small></p>${G.map(l=>`<div class=wi><div><b>${esc(l.y)}</b> <small>${new Date(l.t).toLocaleString('vi-VN')}</small><p>${esc(l.m)}</p></div></div>`).join('')||'<p>Chưa có log.</p>'}`;
 $$('[data-lf]',p).forEach(a=>a.onclick=()=>{LGF=a.dataset.lf;admin()});
 $('#lx').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D.LG||[],null,1)],{type:'application/json'}));a.download='log-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
 $('#lc').onclick=()=>ask('Xóa toàn bộ log?',()=>{D.LG=[];save(null);toast('Đã xóa log');admin()})},
settings(p){p.innerHTML=`<h1>Settings</h1><h3>TEST MODE</h3><label><input type=checkbox id=tm ${D.A.test?'checked':''}> Bật test mode</label>${D.A.test?`<p><button id=sm>Tạo 5 lời chúc mẫu</button> <button id=dm class=dg>Xóa lời chúc mẫu</button></p><p style="margin-top:8px"><a class=btn href="#/">PREVIEW WEBSITE →</a></p>`:''}<p style="margin-top:16px;opacity:.7">Dữ liệu demo lưu trong localStorage của trình duyệt này (isTest: true cho lời chúc mẫu).</p>`;
 $('#tm').onchange=e=>{D.A.test=e.target.checked;save();admin()};
 if(D.A.test){$('#sm').onclick=()=>{const t=Date.now();NM.forEach((n,i)=>D.W.push({id:'t'+t+i,name:n,message:SM[i],status:'visible',isTest:true,createdAt:t-Math.random()*864e5,ipHash:'test'}));save();toast('Đã tạo 5 lời chúc mẫu');admin()};$('#dm').onclick=()=>ask('Xóa toàn bộ lời chúc mẫu?',()=>{D.W=D.W.filter(w=>!w.isTest);save();admin()})}}};
function admin(){
 if(!ADM){const first=!D.pw;app.innerHTML=`<div class="adm login"><form id=lg class=box><b>TEACHER BIRTHDAY</b><p>${first?'Tạo mật khẩu admin (lưu dạng hash trong trình duyệt này)':'Đăng nhập Admin'}</p><input type=password id=pw placeholder="Mật khẩu (≥ 8 ký tự)" minlength=8 required><button class=pri>${first?'Tạo & vào':'Vào'}</button><p id=er class=er></p><small>Demo client-only — bản thật cần xác thực & phân quyền phía server.</small></form></div>`;
  $('#lg').onsubmit=async e=>{e.preventDefault();const h=await sha($('#pw').value);if(first){D.pw=h;save()}else if(h!=D.pw){LOG('login','Đăng nhập sai mật khẩu');save(null);return $('#er').textContent='Sai mật khẩu.'}ADM=1;LOG('login',first?'Tạo mật khẩu & đăng nhập admin':'Đăng nhập admin');save(null);admin()};return}
 app.innerHTML=`<div class=adm><aside><b>TEACHER BIRTHDAY</b>${[['overview','Overview'],['wishes','Wishes'],['memories','Memories'],['hero','Hero'],['content','Content'],['style','Text style'],['spam','Anti-spam'],['gate','Password game'],['log','Log'],['settings','Settings']].map(([k,l])=>`<a data-t=${k} class="${k==TAB?'on':''}">${l}</a>`).join('')}<a href="#/" class=ext>↗ View Website</a><a id=out>Logout</a></aside><main id=pn></main></div>`;
 $$('aside [data-t]').forEach(a=>a.onclick=()=>{TAB=a.dataset.t;admin()});$('#out').onclick=()=>{LOG('login','Đăng xuất');save(null);ADM=0;admin()};PN[TAB]($('#pn'))}
let GOK=0;
const nz=s=>String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ');
const gq=()=>((D.G&&D.G.qs)||[]).filter(q=>q.a&&q.a.length);
const gateOn=()=>{if(ADM||GOK||!D.G||!D.G.on||!gq().length)return false;if(!D.G.r)return true;try{return localStorage.getItem('tb_ok')!=String(D.G.v)}catch(e){return true}};
function gate(done,pv){
 const G=D.G,qs=gq(),ord=G.m=='one'?[Math.floor(Math.random()*qs.length)]:qs.map((_,i)=>i);let n=0;
 const show=()=>{const q=qs[ord[n]];
  app.innerHTML=`<main class="sc flow"><form id=wf class=cp autocomplete=off><p class="tx sm" style="--d:1;text-align:center">${esc(G.title)}${ord.length>1?` · ${n+1} / ${ord.length}`:''}</p><h1 class="tx big" style="--d:2;font-size:clamp(26px,4.5vw,56px)">${esc(q.q)}</h1><label class=tx style=--d:3>Mật khẩu của bạn<input name=a autocomplete=off></label><p id=er class=er></p>${q.h?'<p class="tx sm" id=hn style="--d:4;text-align:center;cursor:pointer">Gợi ý?</p>':''}<button class="tx lk" style=--d:5>MỞ →</button></form></main>`;
  watch();const f=$('#wf');f.a.focus();
  if(q.h)$('#hn').onclick=e=>{e.target.textContent=q.h};
  f.onsubmit=async e=>{e.preventDefault();const h=await sha('tb|'+nz(f.a.value));
   if(!q.a.includes(h)){$('#er').textContent='Chưa đúng, thử lại nhé.';f.classList.remove('x');f.offsetWidth;f.classList.add('x');f.a.select();return}
   if(++n<ord.length)return show();
   if(!pv){GOK=1;if(G.r)try{localStorage.setItem('tb_ok',String(G.v))}catch(_){}}
   f.style.opacity=0;setTimeout(done,800)}};
 show()}
function route(){const h=location.hash.slice(1)||'/';scrollTo(0,0);if(h!='/admin'&&gateOn())return gate(route);({'/wishes':wishes,'/wishes/view':view,'/admin':admin}[h]||home)()}
addEventListener('hashchange',route);

loadData().then(()=>{
    route();
});
</script></body></html>

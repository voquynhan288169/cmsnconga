function tick(){

    const h=innerHeight;

    $$('.sc').forEach(s=>{
        const r=s.getBoundingClientRect();

        if(r.bottom<0||r.top>h)return;

        const p=Math.max(
            -1,
            Math.min(
                1,
                (r.top+r.height/2-h/2)/h

        s.style.setProperty('--p',p.toFixed(3));
        s.style.setProperty('--a',Math.abs(p).toFixed(3));
    });

function watch(){
    io&&io.disconnect();

    io=new IntersectionObserver(
        es=>es.forEach(e=>{
            const s=e.target;

            if(
                e.intersectionRatio>=.6 ||
                e.intersectionRect.height>=innerHeight*.6
            ){
                s.dataset.s='on';
            }else if(!e.isIntersecting){
                s.dataset.s='off';
            }
        }),
        {
            threshold:Array.from(
                {length:21},
                (_,i)=>i/20
            )
        }
    );

    $$('.sc').forEach(s=>{
        s.dataset.s='off';
        io.observe(s);
    });

    tick();
}

 app.innerHTML=`<main class="sc lt" id=wp><form id=wf class=cp autocomplete=off><h1 class="tx big" style=--d:1>${esc(T.wT)}</h1><p class="tx pr" style="--d:2;text-align:center">${esc(T.wD)}</p><label class=tx style=--d:3>Tên của bạn<input name=n maxlength=40></label><label class=tx style=--d:4>Viết lời chúc của bạn...<textarea name=m rows=4 maxlength=${A.max}></textarea></label><p id=er class=er></p><button class="tx lk" style=--d:5>GỬI LỜI CHÚC →</button></form></main>`;
 $('#wf').onsubmit=e=>{e.preventDefault();const f=e.target,r=submit(f.n.value.trim()||'Ẩn danh',f.m.value.trim());if(r)return $('#er').textContent=r;
  const w=$('#wp');w.classList.add('dk');f.style.opacity=0;
  setTimeout(()=>{w.dataset.s='off';w.innerHTML=`<div class=cp><h1 class="tx big" style=--d:1>${esc(T.ok)}</h1><p class="tx pr" style=--d:2>${esc(T.okD)}</p>${D.A.mod?'<p class="tx sm" style=--d:3>Lời chúc sẽ xuất hiện sau khi được duyệt.</p>':''}<a class="tx lk" style=--d:4 href="#/">← VỀ TRANG KỶ NIỆM</a><br><a class="tx lk" style=--d:5 href="#/wishes/view">XEM NHỮNG LỜI CHÚC →</a></div>`;w.offsetWidth;w.dataset.s='on'},1000)};
 watch()}
function view(){
 const T=D.T,w=D.W.filter(x=>x.status=='visible').sort((a,b)=>a.createdAt-b.createdAt);
 app.innerHTML=`<section class=sc><div class=cp><h1 class="tx big" style=--d:1>${esc(T.vT)}</h1><p class="tx sm" style=--d:3>SCROLL ↓</p></div></section>${w.map((x,i)=>`<section class="sc ch${i%2?'':' lt'}"><div class=cp><span class="tx sm" style=--d:1>${String(i+1).padStart(2,'0')}</span><blockquote class="tx w${i%3}${x.message.length>140?' sm2':''}" style=--d:2>“${esc(x.message)}”</blockquote><cite class=tx style=--d:4>— ${esc(x.name)}</cite></div></section>`).join('')||`<section class=sc><p class="tx pr" style=--d:1>Chưa có lời chúc nào.\nHãy là người đầu tiên.</p></section>`}<section class="sc lt"><div class=cp><a class="tx lk" style=--d:1 href="#/wishes">GỬI LỜI CHÚC →</a><br><a class="tx lk" style=--d:2 href="#/">← VỀ TRANG KỶ NIỆM</a></div></section>`;watch()}
/* ---------- ADMIN ---------- */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const img=f=>new Promise(r=>{if(!f)return r('');const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};i.onerror=()=>r('');i.src=u});
const R=(el,o)=>$$('[data-k]',el).forEach(i=>o[i.dataset.k]=i.type=='checkbox'?i.checked:i.type=='number'?Math.max(0,+i.value):i.value);
const F=(o,sp)=>sp.map(([k,l,t])=>`<label>${l}${t=='a'?`<textarea rows=3 data-k=${k}>${esc(o[k])}</textarea>`:`<input ${t=='n'?'type=number min=0':''} data-k=${k} value="${esc(o[k])}">`}</label>`).join('');
const ask=(m,cb)=>{const d=document.createElement('div');d.className='mo';d.innerHTML=`<div class=box><p>${esc(m)}</p><button id=y class=dg>Xác nhận</button><button id=n>Hủy</button></div>`;document.body.append(d);$('#n',d).onclick=()=>d.remove();$('#y',d).onclick=()=>{d.remove();cb()}};
const cnt=f=>D.W.filter(f).length,NM=['Minh','Lan','Ẩn danh','Hà','Nam'],SM=['Chúc cô luôn mạnh khỏe và luôn giữ nụ cười thật đẹp.','Cảm ơn cô vì những bài học chúng em sẽ luôn nhớ.','Chúc cô có một sinh nhật thật hạnh phúc.','Cô là người thầy tuyệt vời nhất của chúng em.','Mong cô luôn bình an và hạnh phúc.'];
const PN={
overview(p){const t=Date.now(),d0=new Date().setHours(0,0,0,0),h24=D.W.filter(w=>t-w.createdAt<864e5),bars=Array.from({length:24},(_,i)=>h24.filter(w=>Math.floor((t-w.createdAt)/36e5)==23-i).length),mx=Math.max(1,...bars),used=D.L.filter(l=>t-l.t<864e5).length,cd=(l,v)=>`<div class=card><small>${l}</small><b>${v}</b></div>`;
 p.innerHTML=`<h1>Overview</h1><div class=grid>${cd('LỜI CHÚC HÔM NAY',cnt(w=>w.createdAt>=d0))}${cd('LỜI CHÚC / 24H (ĐẾM GIỚI HẠN)',used+' / '+D.A.g24)}${cd('7 NGÀY',cnt(w=>t-w.createdAt<6048e5))}${cd('TỔNG LỜI CHÚC',D.W.length)}${cd('ĐANG HIỂN THỊ',cnt(w=>w.status=='visible'))}${cd('CHỜ DUYỆT',cnt(w=>w.status=='pending'))}${cd('ĐÃ ẨN',cnt(w=>w.status=='hidden'))}${cd('ĐÃ XÓA',cnt(w=>w.status=='deleted'))}${cd('BỊ RATE-LIMIT',D.rl)}</div><h3>Lời chúc trong 24 giờ qua</h3><div class=chart>${bars.map(b=>`<i style="height:${b/mx*100}%" title="${b}"></i>`).join('')}</div><div class=ax><span>-24h</span><span>-12h</span><span>Bây giờ</span></div><p style="margin-top:20px"><a class=btn href="#/">XEM WEBSITE →</a></p>`},
wishes(p){const FL=[['all','Tất cả'],['visible','Đang hiển thị'],['pending','Chờ duyệt'],['hidden','Đã ẩn'],['deleted','Đã xóa']],L=D.W.filter(w=>FIL=='all'||w.status==FIL).sort((a,b)=>b.createdAt-a.createdAt);
 p.innerHTML=`<h1>Lời chúc</h1><div class=tabs>${FL.map(([k,l])=>`<a data-f=${k} class="${k==FIL?'on':''}">${l}</a>`).join('')}</div>${L.map(w=>`<div class=wi><div><b>${esc(w.name)}</b> ${w.isTest?'<em>[TEST]</em>':''} <small>${new Date(w.createdAt).toLocaleString('vi-VN')} · ${w.status}</small><p>“${esc(w.message)}”</p><small>IP STATUS: RATE-LIMIT OK</small></div><div class=ac><button data-a=visible data-i="${w.id}">${w.status=='pending'?'DUYỆT':'HIỆN'}</button><button data-a=hidden data-i="${w.id}">ẨN</button><button class=dg data-a=deleted data-i="${w.id}">XÓA</button></div></div>`).join('')||'<p>Chưa có lời chúc.</p>'}`;
 $$('[data-f]',p).forEach(a=>a.onclick=()=>{FIL=a.dataset.f;admin()});
 $$('[data-a]',p).forEach(b=>b.onclick=()=>{const w=D.W.find(x=>x.id==b.dataset.i),a=b.dataset.a;if(a=='deleted')return ask(w.status=='deleted'?'Xóa vĩnh viễn lời chúc này?':'Xóa lời chúc này?',()=>{w.status=='deleted'?D.W=D.W.filter(x=>x!=w):w.status='deleted';save();admin()});w.status=a;save();admin()})},
memories(p){const rd=()=>$$('.mc',p).forEach((c,i)=>R(c,D.M[i])),idx=e=>+e.closest('.mc').dataset.i;
 p.innerHTML=`<h1>Ảnh & Memory</h1><p style="margin-bottom:12px">Kéo thả để đổi thứ tự (hoặc dùng ↑ ↓). Thay đổi áp dụng ngay sau khi lưu.</p>${D.M.map((m,i)=>`<div class=mc draggable=true data-i=${i}><div class=th style="${m.img?`background-image:url('${esc(m.img)}')`:''}">${m.img?'':'MEMORY '+String(i+1).padStart(2,'0')}</div><div><label>Tiêu đề / text overlay<input data-k=t value="${esc(m.t)}"></label><label>Caption<input data-k=c value="${esc(m.c)}"></label><label>Kiểu cảnh<select data-k=k>${[['s','Chữ nhỏ'],['g','Chữ khổng lồ'],['c','Chỉ ảnh'],['x','Chồng ảnh']].map(([v,l])=>`<option value=${v} ${m.k==v?'selected':''}>${l}</option>`).join('')}</select></label><div class=ac><label><input type=checkbox data-k=on ${m.on?'checked':''}> Hiển thị</label><label class=btn>Thay ảnh<input type=file accept="image/*" hidden data-up></label><button data-m=-1>↑</button><button data-m=1>↓</button><button class=dg data-del>Xóa</button></div></div></div>`).join('')}<p><button id=add>+ Thêm memory</button> <button id=sv class=pri>LƯU</button></p>`;
 $('#sv').onclick=()=>{rd();save();toast('Đã lưu')};
 $$('[data-up]',p).forEach(f=>f.onchange=async()=>{rd();const d=await img(f.files[0]);if(d){D.M[idx(f)].img=d;save();admin()}});
 $$('[data-m]',p).forEach(b=>b.onclick=()=>{rd();const i=idx(b),j=i+ +b.dataset.m;if(D.M[j]){[D.M[i],D.M[j]]=[D.M[j],D.M[i]];save();admin()}});
 $$('[data-del]',p).forEach(b=>b.onclick=()=>ask('Xóa memory này?',()=>{rd();D.M.splice(idx(b),1);save();admin()}));
 $('#add').onclick=()=>{rd();D.M.push({id:Date.now(),t:'Tiêu đề mới',c:'',k:'s',on:true,img:''});save();admin()};
 let from;$$('.mc',p).forEach(c=>{c.ondragstart=()=>from=+c.dataset.i;c.ondragover=e=>e.preventDefault();c.ondrop=()=>{rd();D.M.splice(+c.dataset.i,0,D.M.splice(from,1)[0]);save();admin()}})},
hero(p){const H=D.H;p.innerHTML=`<h1>Hero</h1><div class=th style="max-width:360px;margin-bottom:10px;${H.img?`background-image:url('${esc(H.img)}')`:''}">${H.img?'':'Chưa có ảnh'}</div><label class=btn>UPLOAD / CHANGE IMAGE<input type=file accept="image/*" hidden id=up></label>${F(H,[['head','Heading'],['name','Name','a'],['label','Small label'],['scroll','Scroll label']])}<button id=sv class=pri>LƯU</button>`;
 $('#up').onchange=async e=>{const d=await img(e.target.files[0]);if(d){H.img=d;save();admin()}};$('#sv').onclick=()=>{R(p,H);save();toast('Đã lưu')}},
content(p){p.innerHTML=`<h1>Nội dung</h1>${F(D.T,[['teacher','Tên giáo viên'],['ctaT','CTA — tiêu đề'],['ctaD','CTA — mô tả','a'],['cta','CTA — nút'],['fin','Final message','a'],['msg','Birthday message','a'],['bd','Lời kết','a'],['wT','Trang gửi lời chúc — tiêu đề','a'],['wD','Trang gửi lời chúc — mô tả','a'],['ok','Thank-you — tiêu đề'],['okD','Thank-you — nội dung','a'],['vT','Trang xem lời chúc — tiêu đề','a']])}<p style="margin-bottom:12px">Tiêu đề & caption từng memory: tab Memories.</p><button id=sv class=pri>LƯU</button>`;$('#sv').onclick=()=>{R(p,D.T);save();toast('Đã lưu')}},
spam(p){const A=D.A;p.innerHTML=`<h1>Anti-spam</h1><label><input type=checkbox data-k=on ${A.on?'checked':''}> NHẬN LỜI CHÚC (ON / OFF)</label><label><input type=checkbox data-k=mod ${A.mod?'checked':''}> DUYỆT LỜI CHÚC: phải duyệt trước (status = pending)</label>${F(A,[['ip10','Số lời chúc tối đa / IP / 10 phút','n'],['ip24','Số lời chúc tối đa / IP / 24 giờ','n'],['g24','Tổng lời chúc tối đa toàn website / 24 giờ','n'],['cd','Cooldown giữa 2 lần gửi (giây)','n'],['max','Độ dài lời chúc tối đa (ký tự)','n'],['dup','Duplicate message cooldown (phút)','n']])}<button id=sv class=pri>LƯU CÀI ĐẶT</button> <button id=rr class=dg>RESET RATE LIMITS</button>`;
 $('#sv').onclick=()=>{R(p,A);save();toast('Đã lưu cài đặt')};$('#rr').onclick=()=>ask('Reset toàn bộ bộ đếm rate-limit?',()=>{D.L=[];D.rl=0;save();toast('Đã reset');admin()})},
settings(p){p.innerHTML=`<h1>Settings</h1><h3>TEST MODE</h3><label><input type=checkbox id=tm ${D.A.test?'checked':''}> Bật test mode</label>${D.A.test?`<p><button id=sm>Tạo 5 lời chúc mẫu</button> <button id=dm class=dg>Xóa lời chúc mẫu</button></p><p style="margin-top:8px"><a class=btn href="#/">PREVIEW WEBSITE →</a></p>`:''}<p style="margin-top:16px;opacity:.7">Dữ liệu demo lưu trong localStorage của trình duyệt này (isTest: true cho lời chúc mẫu).</p>`;
 $('#tm').onchange=e=>{D.A.test=e.target.checked;save();admin()};
 if(D.A.test){$('#sm').onclick=()=>{const t=Date.now();NM.forEach((n,i)=>D.W.push({id:'t'+t+i,name:n,message:SM[i],status:'visible',isTest:true,createdAt:t-Math.random()*864e5,ipHash:'test'}));save();toast('Đã tạo 5 lời chúc mẫu');admin()};$('#dm').onclick=()=>ask('Xóa toàn bộ lời chúc mẫu?',()=>{D.W=D.W.filter(w=>!w.isTest);save();admin()})}}};
function admin(){
 if(!ADM){const first=!D.pw;app.innerHTML=`<div class="adm login"><form id=lg class=box><b>TEACHER BIRTHDAY</b><p>${first?'Tạo mật khẩu admin (lưu dạng hash trong trình duyệt này)':'Đăng nhập Admin'}</p><input type=password id=pw placeholder="Mật khẩu (≥ 8 ký tự)" minlength=8 required><button class=pri>${first?'Tạo & vào':'Vào'}</button><p id=er class=er></p><small>Demo client-only — bản thật cần xác thực & phân quyền phía server.</small></form></div>`;
  $('#lg').onsubmit=async e=>{e.preventDefault();const h=await sha($('#pw').value);if(first){D.pw=h;save()}else if(h!=D.pw)return $('#er').textContent='Sai mật khẩu.';ADM=1;admin()};return}
 app.innerHTML=`<div class=adm><aside><b>TEACHER BIRTHDAY</b>${[['overview','Overview'],['wishes','Wishes'],['memories','Memories'],['hero','Hero'],['content','Content'],['spam','Anti-spam'],['settings','Settings']].map(([k,l])=>`<a data-t=${k} class="${k==TAB?'on':''}">${l}</a>`).join('')}<a href="#/" class=ext>↗ View Website</a><a id=out>Logout</a></aside><main id=pn></main></div>`;
 $$('aside [data-t]').forEach(a=>a.onclick=()=>{TAB=a.dataset.t;admin()});$('#out').onclick=()=>{ADM=0;admin()};PN[TAB]($('#pn'))}
function route(){const h=location.hash.slice(1)||'/';scrollTo(0,0);({'/wishes':wishes,'/wishes/view':view,'/admin':admin}[h]||home)()}
addEventListener('hashchange',route);

loadData().then(()=>{
    route();
});
</script></body></html>
